name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y perl shellcheck \
            libwww-perl liblwp-protocol-https-perl libjson-perl

      - name: Perl syntax check
        run: perl -I t/stubs -c LightbitsPlugin.pm

      - name: Perl taint mode check
        run: perl -T -I t/stubs -c LightbitsPlugin.pm

      - name: Run unit tests
        run: prove t/

      - name: ShellCheck
        run: shellcheck scripts/install.sh scripts/uninstall.sh

      # --help must work for an unprivileged user (it is parsed before the root
      # check), and an unrecognised option must fail rather than be ignored.
      - name: Script usage output
        run: |
          set -euo pipefail
          for s in scripts/install.sh scripts/uninstall.sh; do
            for flag in -h --help; do
              out=$("$s" "$flag")
              grep -q '^Usage: ' <<<"$out" || { echo "$s $flag: no Usage: line"; exit 1; }
            done
            rc=0; "$s" --not-an-option >/dev/null 2>&1 || rc=$?
            [[ $rc -eq 2 ]] || { echo "$s: unknown option exited $rc, expected 2"; exit 1; }
            [[ -z "$("$s" --not-an-option 2>/dev/null)" ]] || { echo "$s: usage error wrote to stdout"; exit 1; }
          done
          echo "install.sh and uninstall.sh usage handling OK"
