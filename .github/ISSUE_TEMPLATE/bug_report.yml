name: Bug report
description: Something is not working as expected
labels:
- bug
body:
- type: textarea
  id: description
  attributes:
    label: Description
    description: A clear description of the problem.
  validations:
    required: true
- type: input
  id: pve
  attributes:
    label: Proxmox VE version
    description: 'Output of: pveversion'
    placeholder: pve-manager/9.2.28/...
  validations:
    required: true
- type: input
  id: lightos
  attributes:
    label: Lightbits LightOS version
    placeholder: 3.21.1
  validations:
    required: true
- type: input
  id: plugin
  attributes:
    label: Plugin version or commit
    description: The release tag or commit hash you installed from.
    placeholder: v1.0.5
  validations:
    required: true
- type: input
  id: storage
  attributes:
    label: libpve-storage-perl version
    description: 'Output of: dpkg -l libpve-storage-perl | tail -1'
- type: input
  id: kernel
  attributes:
    label: Linux kernel and nvme-cli
    description: 'Output of: uname -r; nvme version'
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: '1.

      2.

      3.

      '
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Relevant logs
    description: 'For example: journalctl -u pvedaemon -n 100 --no-pager. Remove tokens (lb_jwt) and other secrets before pasting.'
    render: text
